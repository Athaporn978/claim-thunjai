<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ออฟไลน์ · ClaimThunJai</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f0f4fd;
        color: #0f172a;
        font-family: "Sarabun", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #fff;
        border-radius: 24px;
        padding: 32px 28px;
        text-align: center;
        box-shadow: 0 10px 40px rgba(15, 23, 42, 0.08);
      }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 20px; font-weight: 800; margin: 20px 0 8px; }
      p { font-size: 14px; line-height: 1.7; color: #475569; margin: 0 0 24px; font-weight: 500; }
      a {
        display: inline-block;
        background: #0071e3;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        font-size: 14px;
        padding: 12px 28px;
        border-radius: 9999px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="H Technology" />
      <h1>ไม่มีการเชื่อมต่ออินเทอร์เน็ต</h1>
      <p>
        ระบบคุมราคาต้องใช้ข้อมูลสดจากเซิร์ฟเวอร์เสมอ<br />
        กรุณาตรวจสอบการเชื่อมต่อแล้วลองใหม่อีกครั้ง
      </p>
      <a href="/quotations">ลองใหม่อีกครั้ง</a>
    </div>
  </body>
</html>
